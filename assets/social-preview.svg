  <text x="144" y="405" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="15" fill="#96a4b2" text-anchor="start">Cert Unifier · paulmann.github.io/cert-unifier</text>
  <text x="76" y="448" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#e6edf3" text-anchor="start"><tspan fill="#4f9cf9">$ </tspan>./cert-unifier.sh --dry-run /etc/letsencrypt/live</text>
  <text x="76" y="475" font-family="Consolas, 'DejaVu Sans Mono', monospace" font-size="17" fill="#96a4b2" text-anchor="start">[INFO] Version: 3.1.1</text>
