  <rect x="615" y="330" width="108" height="36" rx="18" fill="#141d29" stroke="#2a3848" stroke-width="1"/>
  <text x="633" y="354" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="18" fill="#96a4b2" text-anchor="start">2 layouts</text>
  <rect x="735" y="330" width="66" height="36" rx="18" fill="#141d29" stroke="#2a3848" stroke-width="1"/>
  <text x="753" y="354" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="18" fill="#96a4b2" text-anchor="start">MIT</text>
