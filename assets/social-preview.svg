  <text x="192" y="354" font-family="'Segoe UI', 'DejaVu Sans', sans-serif" font-size="18" fill="#96a4b2" text-anchor="start">OpenSSL 1.1.1+</text>
  <rect x="349" y="330" width="98" height="36" rx="18" fill="#141d29" stroke="#2a3848" stroke-width="1"/>
