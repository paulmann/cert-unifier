name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl shellcheck

      - name: Versions
        run: |
          bash --version | head -1
          openssl version
          shellcheck --version | head -2

      - name: ShellCheck
        run: shellcheck -x cert-unifier.sh tests/run-tests.sh

      - name: Run test suite
        run: |
          chmod +x cert-unifier.sh tests/run-tests.sh
          ./tests/run-tests.sh
